model: configs/model_88m.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
init_ckpt: artifacts/checkpoints/sft/best.pt
device: cuda
require_cuda: true
seq_len: 512
microbatch: 1
grad_accum: 8
max_iters: 1500
warmup_iters: 50
lr: 5.0e-6
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
beta: 0.1
log_interval: 20
ckpt_interval: 200
pairs_jsonl: data/post/dpo.jsonl
out_dir: artifacts/checkpoints/dpo
log_csv: artifacts/logs/dpo.csv
seed: 42

model: configs/model_tiny.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
device: cuda
require_cuda: true
seq_len: 128
microbatch: 4
grad_accum: 2
max_iters: 200
warmup_iters: 10
lr: 3.0e-4
min_lr: 3.0e-5
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
log_interval: 20
ckpt_interval: 100
data_bin: data/tokenized/pretrain.bin
val_bin: data/tokenized/pretrain_val.bin
out_dir: artifacts/checkpoints/tiny/pretrain
log_csv: artifacts/logs/tiny_pretrain.csv
seed: 42

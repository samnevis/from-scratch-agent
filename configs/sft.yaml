model: configs/model_88m.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
init_ckpt: artifacts/checkpoints/pretrain/best.pt
device: cuda
require_cuda: true
seq_len: 512
microbatch: 2
grad_accum: 4
max_iters: 400
warmup_iters: 20
lr: 3.0e-5
min_lr: 3.0e-6
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
log_interval: 20
ckpt_interval: 200
data_jsonl: data/post/sft.jsonl
out_dir: artifacts/checkpoints/sft
log_csv: artifacts/logs/sft.csv
seed: 42
# Next-action SFT from pretrain, not the collapsed DPO/mid chain.

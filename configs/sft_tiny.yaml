model: configs/model_tiny.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
init_ckpt: artifacts/checkpoints/tiny/mid/best.pt
device: cuda
require_cuda: true
seq_len: 128
microbatch: 2
grad_accum: 2
max_iters: 100
warmup_iters: 8
lr: 5.0e-5
min_lr: 5.0e-6
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
log_interval: 20
ckpt_interval: 50
data_jsonl: data/post/sft.jsonl
out_dir: artifacts/checkpoints/tiny/sft
log_csv: artifacts/logs/tiny_sft.csv
seed: 42

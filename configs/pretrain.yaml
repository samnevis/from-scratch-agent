model: configs/model_88m.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
device: cuda
require_cuda: true
seq_len: 512
microbatch: 4
grad_accum: 8
max_iters: 2000000
warmup_iters: 500
lr: 3.0e-4
min_lr: 3.0e-5
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
log_interval: 50
ckpt_interval: 8000
val_interval: 1000
val_batches: 8
step_sleep_ms: 70
data_bin: data/tokenized/pretrain.bin
val_bin: data/tokenized/pretrain_val.bin
out_dir: artifacts/checkpoints/pretrain
log_csv: artifacts/logs/pretrain.csv
seed: 42

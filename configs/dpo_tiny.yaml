model: configs/model_tiny.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
init_ckpt: artifacts/checkpoints/tiny/sft/best.pt
device: cuda
require_cuda: true
seq_len: 128
microbatch: 1
grad_accum: 4
max_iters: 60
warmup_iters: 6
lr: 5.0e-6
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
beta: 0.1
log_interval: 10
ckpt_interval: 30
pairs_jsonl: data/post/dpo.jsonl
out_dir: artifacts/checkpoints/tiny/dpo
log_csv: artifacts/logs/tiny_dpo.csv
seed: 42

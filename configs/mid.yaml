model: configs/model_88m.yaml
tokenizer: artifacts/tokenizer/tokenizer.json
init_ckpt: artifacts/checkpoints/pretrain/best.pt
device: cuda
require_cuda: true
seq_len: 512
microbatch: 1
grad_accum: 8
max_iters: 4000
warmup_iters: 100
lr: 1.0e-4
min_lr: 1.0e-5
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
use_amp: true
log_interval: 20
ckpt_interval: 200
mix_jsonl: data/mid/mix.jsonl
out_dir: artifacts/checkpoints/mid
log_csv: artifacts/logs/mid.csv
seed: 42
# Mixture A/B/C weights (PLAN.md §4.3)
mix:
  python: 0.25
  single_turn: 0.40
  traces: 0.35
